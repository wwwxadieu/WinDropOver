name: Release Build

# Publishes WinClipboard.App as a self-contained win-x64 build and attaches two assets to the
# matching GitHub Release: a portable .zip (unpack and run) and a per-user .msi installer
# (Start Menu entry and a proper uninstall entry, no admin rights needed).
#
# Runs automatically when a v* tag is pushed, or manually via workflow_dispatch. The manual
# path works whether or not the tag exists yet: an existing tag is built from as-is, a new one
# is created from the ref the workflow was dispatched on, together with its release. That
# matters because pushing a tag is not always available to whoever is cutting the release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.2-alpha). Created from the selected branch if it does not exist yet.'
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      # No `ref:` here — inputs.tag may name a tag that does not exist yet, which would fail
      # the checkout outright. Take the dispatched ref (or the pushed tag) and switch to the
      # release tag below only once we know it exists. fetch-depth 0 brings the tags along.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build from the release tag if it already exists
        shell: pwsh
        run: |
          $t = "${{ inputs.tag }}"
          if ($t -and (git tag -l $t)) {
            Write-Host "Tag $t already exists - building from it."
            git checkout --quiet $t
          } else {
            Write-Host "Building from $(git rev-parse --abbrev-ref HEAD) at $(git rev-parse --short HEAD)."
          }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore WinClipboard.sln

      - name: Publish WinClipboard.App (self-contained win-x64)
        run: >
          dotnet publish src/WinClipboard.App/WinClipboard.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Zip published output
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath WinClipboard-win-x64.zip

      - name: Resolve target tag
        id: tag
        shell: pwsh
        run: |
          $t = "${{ inputs.tag }}"
          if ([string]::IsNullOrEmpty($t)) { $t = "${{ github.ref_name }}" }
          "tag=$t" >> $env:GITHUB_OUTPUT

          # MSI ProductVersion is strictly numeric major.minor.build.revision, so the tag's
          # leading "v" and any prerelease suffix ("-alpha") have to be stripped: v0.1.2-alpha
          # becomes 0.1.2.0. Without this, wix rejects the version outright.
          $v = $t -replace '^v', '' -replace '-.*$', ''
          $parts = $v.Split('.')
          while ($parts.Count -lt 3) { $parts += '0' }
          $msiVersion = "$($parts[0]).$($parts[1]).$($parts[2]).0"
          "msiVersion=$msiVersion" >> $env:GITHUB_OUTPUT
          Write-Host "Tag $t -> MSI version $msiVersion"

      - name: Install WiX
        run: dotnet tool install --global wix --version 5.*

      - name: Build MSI installer
        shell: pwsh
        run: |
          # Absolute path: WiX resolves Files/@Include relative to the .wxs file, so a bare
          # "publish" resolves to installer\publish and silently harvests nothing.
          $publishDir = (Resolve-Path publish).Path
          wix build installer\WinClipboard.wxs `
            -d Version=${{ steps.tag.outputs.msiVersion }} `
            -d PublishDir="$publishDir" `
            -arch x64 `
            -o WinClipboard-win-x64.msi
          if (-not (Test-Path WinClipboard-win-x64.msi)) { throw "MSI was not produced" }
          $msi = Get-Item WinClipboard-win-x64.msi
          Write-Host "$($msi.Name) $($msi.Length) bytes"
          # Never ship an MSI that installs nothing: an empty one is ~36 KB, a real one tens of MB.
          if ($msi.Length -lt 10MB) {
            throw "MSI is only $($msi.Length) bytes - the publish output was not harvested into it"
          }

      # `gh release upload` fails outright if the release does not exist, so a tag push alone
      # never actually produced a release. Create it here when missing; this also creates the
      # tag itself when the run was dispatched with a new one.
      - name: Create the release if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          # GitHub runs pwsh with $ErrorActionPreference='stop', and PowerShell 7.4+ applies
          # that to native commands too - so `gh release view` on a release that does not
          # exist would throw instead of letting us branch on it. Check exit codes by hand.
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false

          $t = "${{ steps.tag.outputs.tag }}"
          gh release view $t 2>&1 | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $t already exists - attaching to it."
            exit 0
          }

          $title = $t
          $notesFile = "docs/release-notes/$t.md"
          $arguments = @('release', 'create', $t, '--target', (git rev-parse HEAD))

          if (Test-Path $notesFile) {
            # An "# ..." first line is the release title; the rest is the body. Keeping the
            # notes in the repo means they get reviewed with the change, not written at the
            # moment of release from memory.
            $lines = Get-Content $notesFile
            if ($lines[0] -match '^#\s+(.*)') {
              $title = $Matches[1]
              $body = ($lines | Select-Object -Skip 1) -join "`n"
              $bodyFile = Join-Path $env:RUNNER_TEMP 'release-body.md'
              $body.Trim() | Set-Content -Path $bodyFile -Encoding utf8
              $arguments += @('--notes-file', $bodyFile)
            } else {
              $arguments += @('--notes-file', $notesFile)
            }
          } else {
            $arguments += '--generate-notes'
          }

          $arguments += @('--title', $title)
          # A tag carrying a suffix (v0.1.2-alpha, -rc1, -beta) is not a stable release.
          if ($t -match '-') { $arguments += '--prerelease' }

          gh @arguments
          if ($LASTEXITCODE -ne 0) { throw "Could not create release $t" }

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload "${{ steps.tag.outputs.tag }}"
          WinClipboard-win-x64.zip
          WinClipboard-win-x64.msi
          --clobber
