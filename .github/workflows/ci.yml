name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-test:
    # windows-latest ships the full .NET + Windows Desktop (WPF) SDK, which is required to
    # compile WinClipboard.App — that project cannot be built on Linux/macOS runners.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore WinClipboard.sln

      - name: Build (full solution, including WinClipboard.App)
        run: dotnet build WinClipboard.sln -c Release --no-restore

      - name: Test WinClipboard.Core.Tests
        run: dotnet test tests/WinClipboard.Core.Tests -c Release --no-build --verbosity normal

      - name: Test WinClipboard.Data.Tests
        run: dotnet test tests/WinClipboard.Data.Tests -c Release --no-build --verbosity normal

      # Instantiates every window and renders it to a PNG. Doubles as the only check that the
      # XAML actually *loads* — compilation alone would not catch a bad StaticResource key or a
      # binding to a property that does not exist. A non-zero exit here fails the job.
      - name: Capture UI screenshots
        run: |
          $exe = "src/WinClipboard.App/bin/Release/net8.0-windows10.0.19041.0/WinClipboard.exe"
          if (-not (Test-Path $exe)) { throw "Built executable not found at $exe" }
          # Start-Process -Wait: WinClipboard.exe is a GUI-subsystem binary, so `& $exe` would
          # return immediately instead of waiting for the capture to finish.
          $p = Start-Process -FilePath $exe -ArgumentList '--screenshots', "$PWD\screenshots" -Wait -PassThru
          $log = "screenshots/screenshot-log.txt"
          if (Test-Path $log) { Get-Content $log | Write-Host }
          if ($p.ExitCode -ne 0) { throw "Screenshot capture exited with $($p.ExitCode)" }
          Get-ChildItem screenshots -Filter *.png | ForEach-Object { Write-Host "$($_.Name) $($_.Length) bytes" }

      # always(): on a partial failure the PNGs that did render, plus the log naming the window
      # that broke, are exactly what is needed to diagnose it.
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: |
            screenshots/*.png
            screenshots/screenshot-log.txt
          if-no-files-found: warn
