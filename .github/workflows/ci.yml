name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-test:
    # windows-latest ships the full .NET + Windows Desktop (WPF) SDK, which is required to
    # compile WinClipboard.App — that project cannot be built on Linux/macOS runners.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore WinClipboard.sln

      - name: Build (full solution, including WinClipboard.App)
        run: dotnet build WinClipboard.sln -c Release --no-restore

      - name: Test WinClipboard.Core.Tests
        run: dotnet test tests/WinClipboard.Core.Tests -c Release --no-build --verbosity normal

      - name: Test WinClipboard.Data.Tests
        run: dotnet test tests/WinClipboard.Data.Tests -c Release --no-build --verbosity normal

      # Instantiates every window and renders it to a PNG. Doubles as the only check that the
      # XAML actually *loads* — compilation alone would not catch a bad StaticResource key or a
      # binding to a property that does not exist. A non-zero exit here fails the job.
      - name: Capture UI screenshots
        run: |
          $exe = "src/WinClipboard.App/bin/Release/net8.0-windows10.0.19041.0/WinClipboard.exe"
          if (-not (Test-Path $exe)) { throw "Built executable not found at $exe" }
          # Start-Process -Wait: WinClipboard.exe is a GUI-subsystem binary, so `& $exe` would
          # return immediately instead of waiting for the capture to finish.
          $p = Start-Process -FilePath $exe -ArgumentList '--screenshots', "$PWD\screenshots" -Wait -PassThru
          $log = "screenshots/screenshot-log.txt"
          if (Test-Path $log) { Get-Content $log | Write-Host }
          if ($p.ExitCode -ne 0) { throw "Screenshot capture exited with $($p.ExitCode)" }
          Get-ChildItem screenshots -Filter *.png | ForEach-Object { Write-Host "$($_.Name) $($_.Length) bytes" }

      # always(): on a partial failure the PNGs that did render, plus the log naming the window
      # that broke, are exactly what is needed to diagnose it.
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: |
            screenshots/*.png
            screenshots/screenshot-log.txt
          if-no-files-found: warn

  # Builds the MSI on every push/PR rather than only when a release tag is cut. WiX authoring
  # errors are otherwise invisible until release time, which is the worst moment to find them —
  # and WiX cannot validate this file off Windows, so CI is the only place it gets checked.
  # Separate job so it runs alongside build-and-test instead of adding to its wall-clock time.
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish WinClipboard.App (self-contained win-x64)
        run: >
          dotnet publish src/WinClipboard.App/WinClipboard.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Install WiX
        run: dotnet tool install --global wix --version 5.*

      - name: Build MSI installer
        shell: pwsh
        run: |
          # PublishDir must be absolute: WiX resolves Files/@Include relative to the .wxs file,
          # so a bare "publish" became installer\publish, matched nothing, and still built
          # successfully — an MSI whose Start Menu shortcut pointed at a file it never installed.
          $publishDir = (Resolve-Path publish).Path
          # A placeholder version is fine here: this job only proves the authoring builds.
          # release-build.yml derives the real version from the tag.
          wix build installer\WinClipboard.wxs -d Version=0.0.0.0 -d PublishDir="$publishDir" -arch x64 -o WinClipboard-win-x64.msi
          if (-not (Test-Path WinClipboard-win-x64.msi)) { throw "MSI was not produced" }
          $msi = Get-Item WinClipboard-win-x64.msi
          Write-Host "$($msi.Name) $($msi.Length) bytes"
          # Guards against the harvest silently matching nothing again: a self-contained
          # single-file publish is tens of MB, while an empty MSI is around 36 KB.
          if ($msi.Length -lt 10MB) {
            throw "MSI is only $($msi.Length) bytes - the publish output was not harvested into it"
          }

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: installer-msi
          path: WinClipboard-win-x64.msi
          if-no-files-found: error
